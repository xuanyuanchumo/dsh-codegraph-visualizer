project:
  name: "my-project"
  tech_stack: ["typescript"]
  framework: ""

macro_cycle:
  enabled_phases: [plan, design, build, test, deploy, maintain]
  autonomy_level: L2

build:
  build_cmd: "npm run build"
  typecheck_cmd: "npx tsc --noEmit"
  lint_cmd: "npm run lint"
  test_cmd: "npm test"
  coverage_cmd: "npm test -- --coverage"
  e2e_cmd: "npm run test:e2e"
  hygiene_cmd: ""

layers:
  - name: "Frontend"
    test_pattern: "src/**/*.test.ts"
    coverage_target: 80
  - name: "Backend"
    test_pattern: "tests/unit/**/*.test.ts"
    coverage_target: 90
  - name: "Contract"
    test_pattern: "tests/types/**"
    coverage_target: 100

# 评估维度（v1.7.0：名称与 scripts/lib/dimensions.mjs 注册表对齐，修 S-2 双词汇漂移；
# 此处只允许覆盖 checklist_ref 等项目专属材料，不得改写维度名称）
evaluation:
  E1:
    name: "意图对齐"
    checklist_ref: "docs/feature-checklist.md"
  E2:
    name: "规格符合"
    checklist_ref: ""
  E3:
    name: "测试覆盖"
    checklist_ref: ""
  E4:
    name: "代码质量"
    checklist_ref: ""
  E5:
    name: "性能基线"
    checklist_ref: ""
  E6:
    name: "安全检查"
    checklist_ref: ""
  E7:
    name: "文档同步"
    checklist_ref: ""
  E8:
    name: "回归完整性"
    checklist_ref: ""

journeys:
  J1:
    name: "用户注册"
    forward: "注册 → 验证 → 入库"
    reverse: "重复注册、无效邮箱"
    test_files: ["tests/e2e/register.spec.ts"]

gates:
  G0:
    fact_base_verify_count: 5
  G1:
    task_completion_required: true
  G2:
    coverage_threshold:
      lines: 80
      branches: 65
    journey_coverage: true
    chaos_coverage: true
  G3:
    build_commands: ["npm run build"]

human_gates:
  intent_accept:
    role: "product_owner"
  spec_approve:
    role: "product_owner"
    consult: "tech_lead"
  plan_approve:
    role: "engineer"
  pr_merge:
    role: "code_owner"
  release_authorize:
    role: "release_manager"

control_bands:
  enabled: false
  metrics: []
  baseline_window_days: 30
  tiers:
    sigma_1: "log"
    sigma_2: "diagnose"
    sigma_3: "act_via_pr"

framework_alignment:
  name: ""
  rules: []

performance_baselines: []

vision_benchmarking:
  enabled: false
  dimensions: []